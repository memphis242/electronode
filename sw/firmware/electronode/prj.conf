# Kernel services - I'm just going to guess initial sizes roughly
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Application language
CONFIG_CPP=y
CONFIG_STD_CPP20=y

# Hardware interfaces for Phase 1
CONFIG_ADC=y
# TODO: Depending on IMU selection, we will only enable SPI or I2C, not both
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y

# Bluetooth
# note: the exact GATT service and payload layout are still TBD
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="electronode"

# Logs FTW
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
